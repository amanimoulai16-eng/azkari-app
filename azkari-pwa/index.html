const DUA_KEYS = Object.keys(DUAS);
let currentDuaCat = "prayer";

/* ---------- STATE ---------- */
let state = {
  progress: {},        // { "2026-08-23": { morning:{0:2,1:3,...}, evening:{...}, ... } }
  tasbihToday: {},      // { "2026-08-23": count }
  tasbihTarget: 33,
  tasbihAllTime: 0,
  activityDays: [],      // array of date strings with any activity, for streak
  reminders: { morningOn:false, morningTime:"06:30", eveningOn:false, eveningTime:"17:30" }
};
let currentCat = (new Date().getHours() >= 15 || new Date().getHours() < 5) ? "evening" : "morning";
let todayStr = new Date().toISOString().slice(0,10);

/* ---------- STORAGE HELPERS (uses browser localStorage — works on any hosting) ---------- */
async function loadState(){
  try{
    const raw = localStorage.getItem('azkar-state');
    if(raw){ state = Object.assign(state, JSON.parse(raw)); }
  }catch(e){ /* first run, no data yet */ }
  render();
}
let saveTimeout;
function saveState(){
  clearTimeout(saveTimeout);
  saveTimeout = setTimeout(()=>{
    try{ localStorage.setItem('azkar-state', JSON.stringify(state)); }
    catch(e){ console.error('save failed', e); }
  }, 300);
}

function markActivity(){
  if(!state.activityDays.includes(todayStr)){
    state.activityDays.push(todayStr);
  }
}

function computeStreak(){
  let streak = 0;
  let d = new Date();
  while(true){
    const key = d.toISOString().slice(0,10);
    if(state.activityDays.includes(key)){
      streak++;
      d.setDate(d.getDate()-1);
    } else break;
  }
  return streak;
}

/* ---------- GREETING / HEADER ---------- */
function updateHeader(){
  const hour = new Date().getHours();
  const isEvening = hour >= 15 || hour < 5;
  document.getElementById('header').classList.toggle('evening', isEvening);
  document.getElementById('greeting').textContent = isEvening ? "مساء الخير 🌙" : "صباح الخير ☀️";
  document.getElementById('date-label').textContent = new Date().toLocaleDateString('ar-DZ', {weekday:'long', day:'numeric', month:'long'});
}

/* ---------- AZKAR VIEW ---------- */
function renderCatRow(){
  const row = document.getElementById('cat-row');
  row.innerHTML = '';
  CAT_KEYS.forEach(key=>{
    const btn = document.createElement('button');
    btn.className = 'cat-chip' + (key===currentCat ? ' active':'');
    btn.textContent = AZKAR[key].label;
    btn.onclick = ()=>{ currentCat = key; render(); };
    row.appendChild(btn);
  });
}

function getProgress(cat){
  if(!state.progress[todayStr]) state.progress[todayStr] = {};
  if(!state.progress[todayStr][cat]) state.progress[todayStr][cat] = {};
  return state.progress[todayStr][cat];
}

  let currentAudio = null;

function renderAzkarAudio(){

  const title = document.getElementById('azkar-section-title');
  const audioBox = document.getElementById('azkar-audio');

  const category = AZKAR[currentCat];
  const audioFile = AUDIO_FILES[currentCat];

  title.textContent = category.label;

  if(!audioFile){
    audioBox.innerHTML = '';
    return;
  }

  audioBox.innerHTML = `
    <div class="azkar-audio-box">

      <audio id="azkar-player" src="${audioFile}" preload="metadata"></audio>

      <button class="azkar-audio-btn" id="azkar-audio-btn">
        🔊 استماع ${category.label} - مشاري العفاسي
      </button>

    </div>
  `;

  const player = document.getElementById('azkar-player');
  const button = document.getElementById('azkar-audio-btn');

  button.onclick = () => {

    if(currentAudio && currentAudio !== player){
      currentAudio.pause();
      currentAudio.currentTime = 0;
    }

    currentAudio = player;

    if(player.paused){
      player.play();
      button.textContent = `⏸️ إيقاف ${category.label} - مشاري العفاسي`;
    }else{
      player.pause();
      button.textContent = `🔊 استماع ${category.label} - مشاري العفاسي`;
    }
  };

  player.onended = () => {
    button.textContent = `🔊 استماع ${category.label} - مشاري العفاسي`;
  };
}
function renderAzkarList(){
  const list = document.getElementById('azkar-list');
  list.innerHTML = '';
  renderAzkarAudio();
  const items = AZKAR[currentCat].items;
  const prog = getProgress(currentCat);
  items.forEach((item, idx)=>{
    const done = (prog[idx]||0) >= item.target;
    const card = document.createElement('div');
    card.className = 'dhikr-card' + (done ? ' done':'');
    card.innerHTML = `
      <div class="dhikr-text quran-text">${item.text}</div>
      <div class="dhikr-foot">
        <div class="dhikr-count-label">${prog[idx]||0} / ${item.target}</div>
        <button class="tap-btn">${done ? '✓' : (prog[idx]||0)}</button>
      </div>`;
    card.querySelector('.tap-btn').onclick = ()=>{
      if(done){ prog[idx] = 0; }
      else{ prog[idx] = (prog[idx]||0) + 1; }
      markActivity();
      saveState();
      renderAzkarList();
      updateTodayProgress();
      renderStats();
    };
    list.appendChild(card);
  });
}

function updateTodayProgress(){
  const items = AZKAR[currentCat].items;
  const prog = getProgress(currentCat);
  let doneCount = 0;
  items.forEach((it,idx)=>{ if((prog[idx]||0) >= it.target) doneCount++; });
  const pct = items.length ? Math.round((doneCount/items.length)*100) : 0;
  document.getElementById('today-progress-fill').style.width = pct + '%';
  document.getElementById('progress-label').textContent = `${doneCount} من ${items.length} أذكار — ${AZKAR[currentCat].label}`;
  document.getElementById('streak-num').textContent = computeStreak();
}

/* ---------- DUAS VIEW ---------- */
function renderDuaCatRow(){
  const row = document.getElementById('dua-cat-row');
  row.innerHTML = '';
  DUA_KEYS.forEach(key=>{
    const btn = document.createElement('button');
    btn.className = 'cat-chip' + (key===currentDuaCat ? ' active':'');
    btn.textContent = DUAS[key].label;
    btn.onclick = ()=>{ currentDuaCat = key; renderDuaCatRow(); renderDuasList(); };
    row.appendChild(btn);
  });
}
function renderDuaAudio(){

  const audioBox = document.getElementById('dua-audio');

  audioBox.innerHTML = `
    <div class="azkar-audio-box">

      <audio id="dua-player"
             src="audio/adia-djamiaa.mp3"
             preload="metadata"></audio>

      <button class="azkar-audio-btn" id="dua-audio-btn">
        🔊 استماع الأدعية - مشاري العفاسي
      </button>

    </div>
  `;

  const player = document.getElementById('dua-player');
  const button = document.getElementById('dua-audio-btn');

  button.onclick = () => {

    if(currentAudio && currentAudio !== player){
      currentAudio.pause();
      currentAudio.currentTime = 0;
    }

    currentAudio = player;

    if(player.paused){

      player.play();

      button.textContent =
        '⏸️ إيقاف الأدعية - مشاري العفاسي';

    }else{

      player.pause();

      button.textContent =
        '🔊 استماع الأدعية - مشاري العفاسي';

    }

  };

  player.onended = () => {

    button.textContent =
      '🔊 استماع الأدعية - مشاري العفاسي';

  };

}  
function renderDuasList(){
  const list = document.getElementById('duas-list');
  list.innerHTML = '';
  renderDuaAudio();
  DUAS[currentDuaCat].items.forEach(item=>{
    const card = document.createElement('div');
    card.className = 'dhikr-card';
    card.innerHTML = `
      <div style="font-weight:800; font-size:13px; color:var(--turquoise-dark); margin-bottom:8px;">${item.title}</div>
      <div class="dhikr-text quran-text">${item.text}</div>`;
    list.appendChild(card);
  });
}

/* ---------- TASBIH VIEW ---------- */
const BEAD_COUNT = 33;
function renderTargetRow(){
  const row = document.getElementById('target-row');
  row.innerHTML = '';
  [33,99,100].forEach(t=>{
    const chip = document.createElement('button');
    chip.className = 'target-chip' + (state.tasbihTarget===t ? ' active':'');
    chip.textContent = t;
    chip.onclick = ()=>{ state.tasbihTarget = t; saveState(); renderTargetRow(); };
    row.appendChild(chip);
  });
}
function renderBeads(){
  const arc = document.getElementById('beads-arc');
  arc.querySelectorAll('.bead').forEach(b=>b.remove());
  const count = todayTasbih() % BEAD_COUNT;
  const radius = 130;
  for(let i=0;i<BEAD_COUNT;i++){
    const angle = (i / BEAD_COUNT) * 2 * Math.PI - Math.PI/2;
    const x = 140 + radius * Math.cos(angle) - 8;
    const y = 140 + radius * Math.sin(angle) - 8;
    const bead = document.createElement('div');
    bead.className = 'bead' + (i < count ? ' lit' : '');
    bead.style.left = x + 'px';
    bead.style.top = y + 'px';
    arc.appendChild(bead);
  }
}
function todayTasbih(){ return state.tasbihToday[todayStr] || 0; }
function renderTasbihCount(){
  const c = todayTasbih();
  document.getElementById('tasbih-count').textContent = c;
  document.getElementById('tasbih-lap').textContent = 'دورة ' + Math.floor(c / state.tasbihTarget);
  renderBeads();
}
document.getElementById('tap-tasbih').onclick = ()=>{
  state.tasbihToday[todayStr] = todayTasbih() + 1;
  state.tasbihAllTime = (state.tasbihAllTime||0) + 1;
  markActivity();
  saveState();
  renderTasbihCount();
  renderStats();
};
document.getElementById('reset-tasbih').onclick = ()=>{
  state.tasbihToday[todayStr] = 0;
  saveState();
  renderTasbihCount();
};

/* ---------- STATS VIEW ---------- */
function renderStats(){
  let total = 0;
  Object.values(state.progress).forEach(day=>{
    Object.values(day).forEach(cat=>{
      Object.values(cat).forEach(v=> total += v);
    });
  });
  total += state.tasbihAllTime || 0;
  document.getElementById('stat-total').textContent = total;

  let todayCount = 0;
  const todayProg = state.progress[todayStr] || {};
  Object.values(todayProg).forEach(cat=>{ Object.values(cat).forEach(v=> todayCount += v); });
  document.getElementById('stat-today').textContent = todayCount;
  document.getElementById('stat-tasbih').textContent = todayTasbih();
  const streak = computeStreak();
  document.getElementById('stat-streak').textContent = streak;

  // week bars
  const barsRow = document.getElementById('bars-row');
  barsRow.innerHTML = '';
  const days = [];
  for(let i=6;i>=0;i--){
    const d = new Date();
    d.setDate(d.getDate()-i);
    days.push(d.toISOString().slice(0,10));
  }
  const counts = days.map(key=>{
    let c = 0;
    const dayProg = state.progress[key] || {};
    Object.values(dayProg).forEach(cat=>{ Object.values(cat).forEach(v=> c += v); });
    c += state.tasbihToday[key] || 0;
    return c;
  });
  const max = Math.max(...counts, 1);
  const dayLabels = ['أحد','اثنين','ثلاثاء','أربعاء','خميس','جمعة','سبت'];
  days.forEach((key, i)=>{
    const col = document.createElement('div');
    col.className = 'bar-col';
    const h = Math.round((counts[i]/max)*100);
    const dow = new Date(key).getDay();
    col.innerHTML = `<div class="bar" style="height:${h}%"></div><div class="bar-day-lbl">${dayLabels[dow]}</div>`;
    barsRow.appendChild(col);
  });
}

/* ---------- REMINDERS ---------- */
function loadReminderUI(){
  document.getElementById('rem-morning-on').checked = state.reminders.morningOn;
  document.getElementById('rem-morning-time').value = state.reminders.morningTime;
  document.getElementById('rem-evening-on').checked = state.reminders.eveningOn;
  document.getElementById('rem-evening-time').value = state.reminders.eveningTime;
}
['rem-morning-on','rem-morning-time','rem-evening-on','rem-evening-time'].forEach(id=>{
  document.getElementById(id).addEventListener('change', ()=>{
    state.reminders.morningOn = document.getElementById('rem-morning-on').checked;
    state.reminders.morningTime = document.getElementById('rem-morning-time').value;
    state.reminders.eveningOn = document.getElementById('rem-evening-on').checked;
    state.reminders.eveningTime = document.getElementById('rem-evening-time').value;
    saveState();
  });
});
document.getElementById('enable-notif').onclick = async ()=>{
  const status = document.getElementById('notif-status');
  if(!('Notification' in window)){
    status.textContent = 'متصفحك ما يدعمش الإشعارات.';
    return;
  }
  const perm = await Notification.requestPermission();
  status.textContent = perm === 'granted' ? '✅ الإشعارات مفعّلة (خلي الصفحة مفتوحة بش تخدم)' : 'الإذن مرفوض من إعدادات المتصفح.';
};
let lastNotifMinute = '';
setInterval(()=>{
  const now = new Date();
  const hhmm = now.toTimeString().slice(0,5);
  if(hhmm === lastNotifMinute) return;
  if(state.reminders.morningOn && hhmm === state.reminders.morningTime){
    fireNotif('حان وقت أذكار الصباح 🌅');
    lastNotifMinute = hhmm;
  } else if(state.reminders.eveningOn && hhmm === state.reminders.eveningTime){
    fireNotif('حان وقت أذكار المساء 🌙');
    lastNotifMinute = hhmm;
  }
}, 20000);
function fireNotif(msg){
  if('Notification' in window && Notification.permission === 'granted'){
    new Notification('أذكاري', { body: msg });
  }
}

/* ---------- NAV ---------- */
function switchView(viewId){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById(viewId).classList.add('active');
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.view===viewId));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active', b.dataset.view===viewId));
  if(viewId === 'stats-view') renderStats();
  if(viewId === 'tasbih-view'){ renderTargetRow(); renderTasbihCount(); }
}
document.querySelectorAll('.tab-btn, .nav-btn').forEach(btn=>{
  btn.addEventListener('click', ()=> switchView(btn.dataset.view));
});

/* ---------- RENDER ALL ---------- */
function render(){
  updateHeader();
  renderCatRow();
  renderAzkarList();
  updateTodayProgress();
  renderDuaCatRow();
  renderDuasList();
  renderTargetRow();
  renderTasbihCount();
  renderStats();
  loadReminderUI();
}

loadState();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
  });
}
</script>
